  operations.resourceSinglePid:
    # Geändert auf Typ 'page' für TYPO3 v14
    type: page
    default: 0
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.resourceSinglePid'
