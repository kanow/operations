
# Definition der Kategorien für den Constant Editor / Settings UI
categories:
  Operations:
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_be.xlf:plugin.title'
  Operations.template:
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.subcategoryLabel.template'
    parent: 'Operations'
  Operations.pids:
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.subcategoryLabel.pids'
    parent: 'Operations'
  Operations.list:
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.subcategoryLabel.list'
    parent: 'Operations'
  Operations.media:
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.subcategoryLabel.media'
    parent: 'Operations'
  Operations.paginate:
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.subcategoryLabel.paginate'
    parent: 'Operations'

settings:
  operations.css:
    type: string
    default: ''
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.css'
    category: 'Operations.template'

  operations.jquery:
    type: string
    default: 'https://ajax.googleapis.com/ajax/libs/jquery/2.0.3/jquery.min.js'
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.jquery'
    category: 'Operations.template'

  operations.view.templateRootPath:
    type: string
    default: 'EXT:operations/Resources/Private/Templates/'
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.templateRootPath'
    category: 'Operations.template'
    description: ''
  operations.view.partialRootPath:
    type: string
    default: 'EXT:operations/Resources/Private/Partials/'
    label: 'LLL:EXT:operations/Resources/Private/Language/locallang_db.xlf:tsc.partialRootPath'
    category: 'Operations.template'
    description: ''
