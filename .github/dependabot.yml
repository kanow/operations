---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[TASK]"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "development"
    ignore:
      # Keep in sync with the constraints of typo3/testing-framework
      - dependency-name: "phpunit/phpunit"
        versions: [">= 12"]
      - dependency-name: "phpunit/phpcov"
        versions: [">= 11"]
      - dependency-name: "symfony/*"
        versions: [">= 8"]
      - dependency-name: "typo3/cms-*"
    versioning-strategy: "increase"
    commit-message:
      prefix: "[TASK]"
